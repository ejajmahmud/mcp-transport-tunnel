[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-transport-tunnel"
version = "0.1.0"
description = "Bidirectional framing protocol and multiplexed JSON-RPC message bridge"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
mcp-transport-tunnel = "mcp_transport_tunnel.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_transport_tunnel*"]
